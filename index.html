<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#FFE9CF">
  <title>合成大鱼</title>
  <link rel="icon" href="./favicon.ico" type="image/x-icon">
  <style>
    @import url(https://fonts.bunny.net/css?family=nunito:400,600,700,800,900);

    :root {
      --cream: #FFF9F1;
      --cream-deep: #FFE9D2;
      --ink: #35231A;
      --ink-soft: #6E5340;
      --muted: #9A7C67;
      --coral: #F0602F;
      --coral-light: #FF8A5C;
      --coral-deep: #C94318;
      --line: rgba(120, 70, 40, 0.14);
      --font: 'Nunito', 'PingFang SC', 'Microsoft YaHei UI', 'Microsoft YaHei', system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: var(--font);
      color: var(--ink);
      background:
        radial-gradient(120% 90% at 10% 0%, #FFE5CA 0%, rgba(255, 229, 202, 0) 60%),
        radial-gradient(100% 80% at 92% 100%, #FFD3BC 0%, rgba(255, 211, 188, 0) 55%),
        linear-gradient(160deg, #FDEFE0 0%, #F4D6BA 100%);
      -webkit-font-smoothing: antialiased;
    }

    body::before,
    body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(60px);
      pointer-events: none;
      z-index: 0;
    }

    body::before {
      width: 46vmin;
      height: 46vmin;
      left: -12vmin;
      bottom: -10vmin;
      background: rgba(255, 150, 105, 0.35);
      animation: drift 18s ease-in-out infinite alternate;
    }

    body::after {
      width: 38vmin;
      height: 38vmin;
      right: -8vmin;
      top: -6vmin;
      background: rgba(255, 196, 130, 0.4);
      animation: drift 22s ease-in-out infinite alternate-reverse;
    }

    .stage {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
    }

    .game-frame {
      position: relative;
      overflow: hidden;
      border-radius: 32px;
      background: var(--cream);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.65),
        0 0 0 10px rgba(255, 255, 255, 0.16),
        0 42px 80px -24px rgba(140, 62, 30, 0.5);
    }

    .game-frame::after {
      content: '';
      position: absolute;
      inset: 0;
      z-index: 30;
      border-radius: inherit;
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, 0.55),
        inset 0 2px 0 rgba(255, 255, 255, 0.45);
      pointer-events: none;
    }

    #game-canvas {
      position: relative;
      background: radial-gradient(130% 80% at 50% -10%, #FFFBF4 0%, #FFF1DE 42%, #FFE4C5 100%);
    }

    #game-canvas canvas {
      position: relative;
      z-index: 1;
      display: block;
      touch-action: none;
    }

    #game-ui {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 2;
      width: 640px;
      height: 960px;
      transform-origin: top left;
      pointer-events: none;
      user-select: none;
      font-weight: 700;
      line-height: 1.4;
      overflow: hidden;
    }

    /* ---------- menu ---------- */
    #menu-layer {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: radial-gradient(130% 80% at 50% -10%, #FFFBF4 0%, #FFF1DE 42%, #FFE4C5 100%);
      transition: opacity 0.4s ease, transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    #menu-layer::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(58% 40% at 50% 44%, rgba(255, 188, 138, 0.55) 0%, rgba(255, 188, 138, 0) 70%),
        radial-gradient(42% 32% at 10% 6%, rgba(255, 216, 164, 0.8) 0%, rgba(255, 216, 164, 0) 72%),
        radial-gradient(46% 34% at 94% 92%, rgba(255, 178, 140, 0.6) 0%, rgba(255, 178, 140, 0) 70%);
    }

    #menu-layer::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(160, 90, 50, 0.18) 1.5px, transparent 1.5px);
      background-size: 28px 28px;
      opacity: 0.45;
      -webkit-mask-image: radial-gradient(circle at 50% 46%, #000 10%, transparent 68%);
      mask-image: radial-gradient(circle at 50% 46%, #000 10%, transparent 68%);
    }

    #game-ui.is-playing #menu-layer {
      opacity: 0;
      transform: scale(1.04);
      visibility: hidden;
      pointer-events: none;
    }

    .orbit {
      position: absolute;
      left: 50%;
      top: 46%;
      width: 0;
      height: 0;
      z-index: 1;
    }

    .orbit-item {
      position: absolute;
      left: -34px;
      top: -34px;
      display: block;
      width: 68px;
      height: 68px;
      transform: rotate(var(--a)) translateX(252px) rotate(calc(-1 * var(--a)));
    }

    .orbit-item img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      border: 4px solid rgba(255, 255, 255, 0.95);
      background: var(--cream);
      box-shadow: 0 10px 22px rgba(120, 60, 30, 0.2);
      animation: float 6s ease-in-out infinite;
      animation-delay: var(--d, 0s);
    }

    .menu-disc {
      position: absolute;
      left: 50%;
      top: 46%;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 404px;
      height: 404px;
      padding: 40px 24px;
      border-radius: 50%;
      text-align: center;
      background: radial-gradient(120% 120% at 30% 0%, #FFFFFF 0%, #FFF7EB 46%, #FFE6CB 100%);
      box-shadow:
        0 32px 64px -12px rgba(170, 80, 40, 0.3),
        inset 0 0 0 1px rgba(255, 255, 255, 0.9);
      transform: translate(-50%, -50%);
      animation: rise-disc 0.65s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .menu-disc::after {
      content: '';
      position: absolute;
      inset: 13px;
      border: 1px dashed rgba(200, 120, 80, 0.28);
      border-radius: 50%;
      pointer-events: none;
    }

    .menu-eyebrow {
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0.38em;
      text-indent: 0.38em;
      color: var(--coral);
    }

    .menu-title {
      margin-top: 16px;
      font-size: 104px;
      font-weight: 900;
      line-height: 1.02;
      letter-spacing: 0.05em;
      text-indent: 0.05em;
      color: var(--ink);
      text-shadow: 0 6px 0 rgba(255, 255, 255, 0.6);
    }

    .menu-title span {
      color: var(--coral);
    }

    .menu-tagline {
      margin-top: 22px;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--muted);
    }

    .menu-actions {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 66px;
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      animation: rise 0.65s 0.1s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      min-width: 292px;
      padding: 22px 40px;
      border: 0;
      border-radius: 999px;
      font-family: inherit;
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 0.12em;
      text-indent: 0.12em;
      color: #fff;
      cursor: pointer;
      pointer-events: auto;
      background: linear-gradient(180deg, #FF8F63 0%, #F4602F 58%, #E44E1E 100%);
      box-shadow:
        0 16px 30px -6px rgba(224, 78, 30, 0.55),
        inset 0 2px 0 rgba(255, 255, 255, 0.4),
        inset 0 -4px 0 rgba(150, 40, 10, 0.22);
      transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
    }

    .btn-primary .arrow {
      display: inline-block;
      font-size: 24px;
      transition: transform 0.18s ease;
    }

    .btn-primary:hover {
      transform: translateY(-3px);
      filter: saturate(1.08);
      box-shadow:
        0 22px 38px -8px rgba(224, 78, 30, 0.6),
        inset 0 2px 0 rgba(255, 255, 255, 0.4),
        inset 0 -4px 0 rgba(150, 40, 10, 0.22);
    }

    .btn-primary:hover .arrow {
      transform: translateX(4px);
    }

    .btn-primary:active {
      transform: translateY(1px) scale(0.99);
    }

    .menu-hint {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: rgba(110, 83, 64, 0.72);
    }

    .hint-touch {
      display: none;
    }

    @media (hover: none) {
      .hint-mouse {
        display: none;
      }

      .hint-touch {
        display: inline;
      }
    }

    /* ---------- in-game hud ---------- */
    #aim-line,
    #game-status {
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.4s ease 0.15s, visibility 0s linear 0.55s;
    }

    #game-ui.is-playing #game-status {
      opacity: 1;
      visibility: visible;
      transition: opacity 0.4s ease 0.2s, visibility 0s linear 0s;
    }

    #game-ui.is-playing #aim-line {
      opacity: 1;
      visibility: visible;
      transition: opacity 0.25s ease, visibility 0s linear 0s;
    }

    #danger-line {
      position: absolute;
      left: 0;
      right: 0;
      top: 84px;
      z-index: 0;
      border-top: 2px dashed rgba(240, 96, 47, 0.3);
      pointer-events: none;
    }

    #danger-line span {
      position: absolute;
      right: 18px;
      top: -12px;
      padding: 0 8px;
      font-size: clamp(10px, calc(12px * var(--ui-scale, 1)), 12px);
      font-weight: 900;
      letter-spacing: 0.2em;
      color: rgba(201, 67, 24, 0.55);
      background: rgba(255, 245, 232, 0.9);
      border-radius: 6px;
    }

    #aim-line {
      position: absolute;
      width: 2px;
      left: 320px;
      top: 100px;
      height: 600px;
      z-index: 2;
      border-radius: 2px;
      transform: translateX(-1px);
      background: repeating-linear-gradient(
        to bottom,
        rgba(240, 96, 47, 0.38) 0 8px,
        rgba(240, 96, 47, 0) 8px 18px
      );
    }

    #game-ui.is-lost #aim-line {
      opacity: 0;
      visibility: hidden;
    }

    #game-status {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 4;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 84px;
      padding: 0 24px;
      background: linear-gradient(180deg, rgba(255, 250, 242, 0.94), rgba(255, 240, 222, 0.98));
      border-top: 1px solid rgba(200, 140, 100, 0.22);
      box-shadow: 0 -12px 32px rgba(180, 100, 60, 0.08);
      pointer-events: none;
    }

    .dock-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .dock-label {
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 0.12em;
      color: var(--muted);
    }

    #game-score {
      display: inline-block;
      font-size: 44px;
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.02em;
      color: var(--ink);
      font-variant-numeric: tabular-nums;
      transform-origin: center;
      min-width: 24px;
    }

    #game-score.is-bump {
      animation: bump 0.3s cubic-bezier(0.2, 1.4, 0.4, 1);
    }

    #game-highscore-value {
      font-size: 32px;
      font-weight: 900;
      line-height: 1;
      color: var(--ink);
      font-variant-numeric: tabular-nums;
    }

    .next-orb {
      display: grid;
      place-items: center;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: radial-gradient(circle at 34% 28%, #FFFFFF, #FFECD6);
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, 0.9),
        0 7px 18px rgba(160, 90, 50, 0.16);
    }

    .next-orb img {
      width: 48px;
      height: 48px;
      object-fit: contain;
    }

    .next-orb.is-pop {
      animation: bump 0.32s cubic-bezier(0.2, 1.4, 0.4, 1);
    }

    .btn-icon {
      position: relative;
      display: grid;
      place-items: center;
      width: 46px;
      height: 46px;
      padding: 0;
      border: 1.5px solid rgba(240, 96, 47, 0.35);
      border-radius: 50%;
      color: var(--coral-deep);
      background: rgba(255, 255, 255, 0.62);
      cursor: pointer;
      pointer-events: auto;
      transition: background 0.18s ease, color 0.18s ease, transform 0.18s ease, border-color 0.18s ease;
    }

    .btn-icon::before {
      content: '';
      position: absolute;
      inset: -10px;
      border-radius: 50%;
    }

    .btn-icon svg {
      width: 22px;
      height: 22px;
      transition: transform 0.3s ease;
    }

    .btn-icon:hover {
      color: #fff;
      background: var(--coral);
      border-color: var(--coral);
      transform: translateY(-1px);
    }

    .btn-icon:hover svg {
      transform: rotate(-45deg);
    }

    .btn-icon:active {
      transform: translateY(1px);
    }

    /* ---------- game over ---------- */
    #game-end-container {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(53, 35, 26, 0.42);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      pointer-events: auto;
    }

    #game-end {
      width: 436px;
      padding: 40px 40px 38px;
      border-radius: 38px;
      text-align: center;
      background: linear-gradient(165deg, #FFFDF9 0%, #FFF3E2 56%, #FFE6CB 100%);
      border: 1px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 40px 80px rgba(80, 30, 10, 0.36);
      animation: pop 0.45s cubic-bezier(0.16, 1.2, 0.3, 1) both;
    }

    .end-emoji {
      display: grid;
      place-items: center;
      width: 86px;
      height: 86px;
      margin: 0 auto 20px;
      border-radius: 50%;
      font-size: 40px;
      line-height: 1;
      background: radial-gradient(circle at 34% 28%, #FFFFFF, #FFE1C4);
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, 0.9),
        0 12px 26px rgba(180, 90, 50, 0.2);
    }

    #game-end-title {
      font-size: 42px;
      font-weight: 900;
      letter-spacing: 0.04em;
      color: var(--ink);
    }

    #game-end.is-record #game-end-title {
      color: var(--coral);
    }

    .end-caption {
      margin-top: 26px;
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 0.24em;
      text-indent: 0.24em;
      color: var(--muted);
    }

    #game-end-score {
      margin-top: 8px;
      font-size: 72px;
      font-weight: 900;
      line-height: 1;
      color: var(--coral);
      font-variant-numeric: tabular-nums;
    }

    #game-end-link {
      display: block;
      margin-top: 30px;
      padding: 20px;
      border-radius: 999px;
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 0.14em;
      text-indent: 0.14em;
      text-decoration: none;
      color: #fff;
      background: linear-gradient(180deg, #FF8F63 0%, #F4602F 58%, #E44E1E 100%);
      box-shadow:
        0 14px 28px -6px rgba(224, 78, 30, 0.55),
        inset 0 2px 0 rgba(255, 255, 255, 0.35);
      transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
    }

    #game-end-link:hover {
      transform: translateY(-2px);
      filter: saturate(1.08);
      box-shadow:
        0 20px 34px -8px rgba(224, 78, 30, 0.6),
        inset 0 2px 0 rgba(255, 255, 255, 0.35);
    }

    #game-end-link:active {
      transform: translateY(1px);
    }

    @keyframes bump {
      0% { transform: scale(1); }
      38% { transform: scale(1.13); }
      100% { transform: scale(1); }
    }

    @keyframes rise-disc {
      from { opacity: 0; transform: translate(-50%, calc(-50% + 24px)) scale(0.94); }
      to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(22px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pop {
      from { opacity: 0; transform: translateY(22px) scale(0.92); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-9px); }
    }

    @keyframes drift {
      from { transform: translate3d(0, 0, 0); }
      to { transform: translate3d(40px, -30px, 0); }
    }

    @media (max-width: 720px) {
      .game-frame {
        border-radius: 22px;
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.6),
          0 24px 48px -16px rgba(140, 62, 30, 0.45);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="game-frame">
      <div id="game-canvas">
        <div id="danger-line" aria-hidden="true"><span>危险线</span></div>
        <div id="game-ui">
          <div id="menu-layer">
            <div class="orbit" aria-hidden="true">
              <span class="orbit-item" style="--a: 0deg; --d: 0s"><img src="./assets/img/circle0.png" alt="" decoding="async"></span>
              <span class="orbit-item" style="--a: 32.73deg; --d: -0.6s"><img src="./assets/img/circle1.png" alt="" decoding="async"></span>
              <span class="orbit-item" style="--a: 65.45deg; --d: -1.2s"><img src="./assets/img/circle2.png" alt="" decoding="async"></span>
              <span class="orbit-item" style="--a: 98.18deg; --d: -1.8s"><img src="./assets/img/circle3.png" alt="" decoding="async"></span>
              <span class="orbit-item" style="--a: 130.91deg; --d: -2.4s"><img src="./assets/img/circle4.png" alt="" decoding="async"></span>
              <span class="orbit-item" style="--a: 163.64deg; --d: -3s"><img src="./assets/img/circle5.png" alt="" decoding="async"></span>
              <span class="orbit-item" style="--a: 196.36deg; --d: -3.6s"><img src="./assets/img/circle6.png" alt="" decoding="async"></span>
              <span class="orbit-item" style="--a: 229.09deg; --d: -4.2s"><img src="./assets/img/circle7.png" alt="" decoding="async"></span>
              <span class="orbit-item" style="--a: 261.82deg; --d: -4.8s"><img src="./assets/img/circle8.png" alt="" decoding="async"></span>
              <span class="orbit-item" style="--a: 294.55deg; --d: -5.4s"><img src="./assets/img/circle9.png" alt="" decoding="async"></span>
              <span class="orbit-item" style="--a: 327.27deg; --d: -6s"><img src="./assets/img/circle10.png" alt="" decoding="async"></span>
            </div>

            <div class="menu-disc">
              <p class="menu-eyebrow">MERGE &amp; GROW</p>
              <h1 class="menu-title">合成<br><span>大鱼</span></h1>
              <p class="menu-tagline">相同的相遇，合成更大的</p>
            </div>

            <div class="menu-actions">
              <button id="btn-start" class="btn-primary" type="button">
                开始游戏
                <span class="arrow" aria-hidden="true">→</span>
              </button>
              <p class="menu-hint">
                <span class="hint-mouse">移动鼠标瞄准 · 点击投放</span>
                <span class="hint-touch">滑动屏幕瞄准 · 松手投放</span>
              </p>
            </div>
          </div>

          <div id="aim-line" aria-hidden="true"></div>

          <div id="game-status">
            <div class="dock-group">
              <span class="dock-label">得分</span>
              <span id="game-score">0</span>
            </div>
            <div class="dock-group">
              <span class="dock-label">最高分</span>
              <span id="game-highscore-value">0</span>
            </div>
            <div class="dock-group">
              <span class="dock-label">下一个</span>
              <span class="next-orb">
                <img id="game-next-fruit" src="./assets/img/circle0.png" alt="下一个水果">
              </span>
            </div>
            <button id="btn-restart" class="btn-icon" type="button" aria-label="重新开始" title="重新开始">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M4 12a8 8 0 1 0 3-6.24"></path>
                <path d="M4 4v5h5"></path>
              </svg>
            </button>
          </div>

          <div id="game-end-container">
            <div id="game-end">
              <div class="end-emoji" aria-hidden="true">🐟</div>
              <div id="game-end-title">游戏结束</div>
              <p class="end-caption">本局得分</p>
              <div id="game-end-score">0</div>
              <a id="game-end-link" href="">再来一局</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script type="text/javascript" src="./matter.js"></script>
  <script type="text/javascript" src="./index.js?v=5"></script>
</body>
</html>
